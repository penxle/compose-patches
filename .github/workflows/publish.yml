name: Publish Compose patch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: compose-patches-publish
  cancel-in-progress: false

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_work: ${{ steps.discover.outputs.has_work }}
      matrix: ${{ steps.discover.outputs.matrix }}

    steps:
      - name: Check out patch repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Find unpublished or changed releases
        id: discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          manifests=(releases/*/release.json)
          ((${#manifests[@]} > 0))

          matrix='{"include":[]}'
          seen_coordinates=()
          pom_file="$(mktemp)"
          trap 'rm -f "$pom_file"' EXIT

          for manifest in "${manifests[@]}"; do
            release="${manifest#releases/}"
            release="${release%/release.json}"
            [[ "$release" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]

            jq -e '
              type == "object" and
              (.upstream_repository | type == "string" and test("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$")) and
              (.upstream_commit | type == "string" and test("^[0-9a-f]{40}$")) and
              (.version_property | type == "string" and test("^[A-Za-z0-9_.-]+$")) and
              (.version | type == "string" and . == $release) and
              (.patches | type == "array" and length > 0 and
                all(.[]; type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*$")) and
                length == (unique | length)) and
              (.publications | type == "array" and length > 0 and all(.[];
                type == "object" and
                (.group | type == "string" and test("^[A-Za-z0-9_.-]+$")) and
                (.artifact | type == "string" and test("^[A-Za-z0-9_.-]+$")) and
                (.task | type == "string" and test("^(:[A-Za-z][A-Za-z0-9_-]*)+:publish[A-Za-z][A-Za-z0-9]*PublicationToGitHubPackagesRepository$"))
              )) and
              ([.publications[].task] | length == (unique | length)) and
              ([.publications[] | .group + ":" + .artifact] | length == (unique | length))
            ' --arg release "$release" "$manifest" > /dev/null

            upstream_repository="$(jq -r '.upstream_repository' "$manifest")"
            upstream_commit="$(jq -r '.upstream_commit' "$manifest")"
            version="$(jq -r '.version' "$manifest")"
            provenance_sha256="$(
              {
                jq -S -c . "$manifest"
                while IFS= read -r patch_id; do
                  patch_manifest="patches/$patch_id/patch.json"
                  test -f "patches/$patch_id/README.md"
                  jq -e '
                    type == "object" and
                    (.upstream_repository == $upstream_repository) and
                    (.upstream_commit == $upstream_commit) and
                    (.version == $version) and
                    (.files | type == "array" and length > 0 and
                      all(.[]; type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*\\.patch$")) and
                      length == (unique | length)) and
                    (.verify_commands | type == "array" and length > 0 and
                      all(.[]; type == "array" and length > 0 and
                        all(.[]; type == "string" and length > 0)))
                  ' --arg upstream_repository "$upstream_repository" \
                    --arg upstream_commit "$upstream_commit" \
                    --arg version "$version" \
                    "$patch_manifest" > /dev/null

                  printf '\0%s\0' "$patch_id"
                  jq -S -c . "$patch_manifest"
                  while IFS= read -r patch_file; do
                    path="patches/$patch_id/$patch_file"
                    test -f "$path"
                    printf '\0%s\0' "$patch_file"
                    cat "$path"
                  done < <(jq -r '.files[]' "$patch_manifest")
                done < <(jq -r '.patches[]' "$manifest")
              } | sha256sum | cut -d ' ' -f 1
            )"
            missing_tasks=()
            replacements='[]'

            while IFS= read -r publication; do
              group="$(jq -r '.group' <<< "$publication")"
              artifact="$(jq -r '.artifact' <<< "$publication")"
              task="$(jq -r '.task' <<< "$publication")"
              coordinate="$group:$artifact:$version"

              for seen_coordinate in "${seen_coordinates[@]}"; do
                if [[ "$seen_coordinate" == "$coordinate" ]]; then
                  echo "Duplicate publication coordinate: $coordinate" >&2
                  exit 1
                fi
              done
              seen_coordinates+=("$coordinate")

              group_path="${group//./\/}"
              pom_url="https://maven.pkg.github.com/penxle/compose-patches/$group_path/$artifact/$version/$artifact-$version.pom"
              status="$(curl --silent --show-error --location --output "$pom_file" --write-out '%{http_code}' \
                --user "$GITHUB_ACTOR:$GITHUB_TOKEN" "$pom_url")"

              case "$status" in
                200)
                  published_sha256="$(sed -n \
                    's:.*<typie.patch.sha256>\([0-9a-f]\{64\}\)</typie.patch.sha256>.*:\1:p' "$pom_file")"
                  if [[ "$published_sha256" == "$provenance_sha256" ]]; then
                    echo "Already published with matching provenance: $coordinate"
                  else
                    echo "Replacing package with different provenance: $coordinate"
                    missing_tasks+=("$task")
                    replacement="$(jq -cn --arg package "$group.$artifact" --arg version "$version" \
                      '{package: $package, version: $version}')"
                    replacements="$(jq -c --argjson replacement "$replacement" '. += [$replacement]' <<< "$replacements")"
                  fi
                  ;;
                404)
                  echo "Missing: $coordinate"
                  missing_tasks+=("$task")
                  ;;
                *)
                  echo "Unable to check $coordinate: HTTP $status" >&2
                  exit 1
                  ;;
              esac
            done < <(jq -c '.publications[]' "$manifest")

            if ((${#missing_tasks[@]} > 0)); then
              tasks="$(jq -cn '$ARGS.positional' --args "${missing_tasks[@]}")"
              entry="$(jq -cn --arg release "$release" --arg provenance_sha256 "$provenance_sha256" \
                --argjson publish_tasks "$tasks" --argjson replacements "$replacements" \
                '{release: $release, provenance_sha256: $provenance_sha256, publish_tasks: $publish_tasks, replacements: $replacements}')"
              matrix="$(jq -c --argjson entry "$entry" '.include += [$entry]' <<< "$matrix")"
            fi
          done

          if [[ "$(jq '.include | length' <<< "$matrix")" -gt 0 ]]; then
            echo 'has_work=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_work=false' >> "$GITHUB_OUTPUT"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  publish:
    needs: discover
    if: needs.discover.outputs.has_work == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out patch repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Load release
        id: release
        env:
          RELEASE: ${{ matrix.release }}
        run: |
          manifest="$GITHUB_WORKSPACE/releases/$RELEASE/release.json"
          {
            echo "upstream_repository=$(jq -r '.upstream_repository' "$manifest")"
            echo "upstream_commit=$(jq -r '.upstream_commit' "$manifest")"
            echo "version_property=$(jq -r '.version_property' "$manifest")"
            echo "version=$(jq -r '.version' "$manifest")"
            echo "patches=$(jq -c '.patches' "$manifest")"
          } >> "$GITHUB_OUTPUT"

      - name: Check out upstream
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.release.outputs.upstream_repository }}
          ref: ${{ steps.release.outputs.upstream_commit }}
          path: upstream
          persist-credentials: false

      - name: Select Xcode
        run: |
          # Compose 1.12.0 compiles CMPUIKitUtils against unguarded iOS 26 SDK symbols, so the
          # image default Xcode is not enough. Upstream selects the same toolchain explicitly in
          # .github/actions/setup-xcode.
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcodebuild -version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Apply patches
        env:
          RELEASE: ${{ matrix.release }}
          PATCHES: ${{ steps.release.outputs.patches }}
          UPSTREAM_COMMIT: ${{ steps.release.outputs.upstream_commit }}
        run: |
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          while IFS= read -r patch_id; do
            manifest="$GITHUB_WORKSPACE/patches/$patch_id/patch.json"
            while IFS= read -r patch_file; do
              path="$GITHUB_WORKSPACE/patches/$patch_id/$patch_file"
              test -f "$path"
              git -C upstream apply --check "$path"
              git -C upstream apply "$path"
            done < <(jq -r '.files[]' "$manifest")
          done < <(jq -r '.[]' <<< "$PATCHES")

      - name: Verify patches
        working-directory: upstream
        env:
          PATCHES: ${{ steps.release.outputs.patches }}
        run: |
          while IFS= read -r patch_id; do
            manifest="$GITHUB_WORKSPACE/patches/$patch_id/patch.json"
            while IFS= read -r command; do
              args=()
              while IFS= read -r arg; do args+=("$arg"); done < <(jq -r '.[]' <<< "$command")
              ./gradlew "${args[@]}" --no-configuration-cache --no-configure-on-demand
            done < <(jq -c '.verify_commands[]' "$manifest")
          done < <(jq -r '.[]' <<< "$PATCHES")

      - name: Delete replaced package versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPLACEMENTS: ${{ toJSON(matrix.replacements) }}
        run: |
          while IFS= read -r replacement; do
            package="$(jq -r '.package' <<< "$replacement")"
            version="$(jq -r '.version' <<< "$replacement")"
            package_endpoint="/orgs/$GITHUB_REPOSITORY_OWNER/packages/maven/$package"
            versions_endpoint="$package_endpoint/versions"
            if ! versions="$(gh api --paginate --slurp "$versions_endpoint?per_page=100" 2>&1)"; then
              if [[ "$versions" == *'(HTTP 404)'* ]]; then
                echo "Already deleted: $package:$version"
                continue
              fi
              printf '%s\n' "$versions" >&2
              exit 1
            fi

            version_id="$(jq -r --arg version "$version" '
              [.[][] | select(.name == $version)] |
              if length == 0 then empty
              elif length == 1 then .[0].id
              else error("expected at most one matching package version")
              end
            ' <<< "$versions")"
            if [[ -z "$version_id" ]]; then
              echo "Already deleted: $package:$version"
              continue
            fi

            version_count="$(jq '[.[][]] | length' <<< "$versions")"
            if [[ "$version_count" -eq 1 ]]; then
              delete_endpoint="$package_endpoint"
            else
              delete_endpoint="$versions_endpoint/$version_id"
            fi

            if ! delete_result="$(gh api --method DELETE "$delete_endpoint" 2>&1)"; then
              if [[ "$delete_result" == *'(HTTP 404)'* ]]; then
                echo "Already deleted: $package:$version"
                continue
              fi
              printf '%s\n' "$delete_result" >&2
              exit 1
            fi
            echo "Deleted $package:$version"
          done < <(jq -c '.[]' <<< "$REPLACEMENTS")

      - name: Publish patched artifacts
        working-directory: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATCH_PROVENANCE_SHA256: ${{ matrix.provenance_sha256 }}
          PUBLISH_TASKS: ${{ toJSON(matrix.publish_tasks) }}
          VERSION: ${{ steps.release.outputs.version }}
          VERSION_PROPERTY: ${{ steps.release.outputs.version_property }}
        run: |
          tasks=()
          while IFS= read -r task; do tasks+=("$task"); done < <(jq -r '.[]' <<< "$PUBLISH_TASKS")
          ./gradlew "${tasks[@]}" "-P$VERSION_PROPERTY=$VERSION" --no-configuration-cache --no-configure-on-demand \
            -I "$GITHUB_WORKSPACE/gradle/publish.init.gradle.kts"
